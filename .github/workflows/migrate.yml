name: Migrate Neon Database

# MANUAL FALLBACK ONLY. The automatic path is now the Vercel production build,
# which runs `scripts/migrate-on-deploy.mjs` — see that file for why.
#
# This workflow used to run on every push to main. That trigger was removed for
# two reasons:
#
#   1. Two systems migrating the same database on the same event is worse than
#      one. The advisory lock in `migrate deploy` makes it safe, but "which one
#      applied it?" is a question nobody should have to answer.
#   2. It had stopped working. From 2026-08-06 16:30 UTC onward, every run
#      queued and was dropped without a runner ever attaching (job conclusion
#      `cancelled`, `runner_id: 0`, and each run lasting ~15 minutes against ~28
#      seconds for the runs that succeeded). That is an account-side capacity or
#      billing condition, not a fault in this file — check
#      Settings → Billing → Actions minutes, and Settings → Actions → Runners.
#      Nothing here will run until that is resolved.
#
# Kept because `workflow_dispatch` is still the right home for the one-off
# baseline and repair operations below, and because it is the correct automatic
# path again the moment runners are available.
#
# REQUIRED repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL  — Neon pooled connection string
#   DIRECT_URL    — Neon direct (non-pooled) connection string
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "One-time P3005 fix: tick to mark the already-present migrations as applied before deploying. Leave unchecked for a normal deploy."
        type: boolean
        required: false
        default: false
      repair_snapshot:
        description: "Tick to (re)create the M365CostSnapshot table on the app's own database (idempotent). Use if it was marked applied but the table is missing."
        type: boolean
        required: false
        default: false

# Never let two migration runs overlap.
concurrency:
  group: prisma-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Bounded so a wedged run fails visibly instead of occupying the concurrency
    # group. (This caps execution time, not time spent queued for a runner —
    # GitHub offers no setting for the latter.)
    timeout-minutes: 15
    steps:
      # This job only reads the repo to run migrations; it never pushes back, so
      # don't leave the GITHUB_TOKEN in the local git config for later steps.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # One-time baseline (manual dispatch only, when the baseline box is ticked).
      # Marks the migrations whose schema is ALREADY present in the database as
      # applied, so `migrate deploy` stops failing with P3005. Only writes to the
      # _prisma_migrations history (no DDL). Deliberately excludes any migration
      # whose objects are NOT yet in the DB (e.g. 20260709000000_m365_cost_snapshot)
      # so `migrate deploy` still creates them below.
      - name: Baseline pre-existing migrations
        if: ${{ inputs.baseline }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          for m in \
            0_init \
            20260617120000_add_user_timezone \
            20260618000000_superops_billing \
            20260623000000_subscription_customer_price \
            20260624000000_rate_limit \
            20260624010000_three_role_model \
            20260624020000_crm_opportunities \
            20260624030000_crm_monthly_commission \
            20260624040000_salesforce_connector \
            20260624050000_user_created_audit \
            20260625000000_crm_fix_annual_mrr \
            20260625010000_crm_reclassify_by_name \
            20260625020000_crm_mrr_from_tcv \
            20260625030000_crm_local_edit_lock \
            20260626000000_backups \
            20260626010000_backup_restore \
            20260626020000_sandbox_purge_audit \
            20260626030000_opportunity_locked_fields \
            20260626040000_client_hierarchy \
            20260627000000_sales_quotas_leads ; do
            echo "resolving $m"
            npx --yes prisma@6.19.3 migrate resolve --applied "$m" || echo "  (already applied — skipping)"
          done

      # Repair for a "marked-applied but table-missing" migration: runs the
      # idempotent snapshot migration SQL directly against the app's OWN database
      # (via the same secrets the app uses), so the table lands wherever
      # DATABASE_URL points — no guessing which Neon branch. Safe to re-run.
      - name: Repair M365CostSnapshot table
        if: ${{ inputs.repair_snapshot }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx --yes prisma@6.19.3 db execute --file prisma/migrations/20260709000000_m365_cost_snapshot/migration.sql --schema prisma/schema.prisma

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        # Pinned to the project's Prisma version for consistency.
        run: npx --yes prisma@6.19.3 migrate deploy
